[package]
name = "pb-books"
version.workspace = true
edition.workspace = true

[dependencies]
pb-core = { path = "../pb-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fancy-regex = "0.14"
roxmltree = "0.20"
encoding_rs = "0.8"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
rayon = "1"

[dev-dependencies]
encoding_rs = "0.8"
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
