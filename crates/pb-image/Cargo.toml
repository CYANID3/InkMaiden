[package]
name = "pb-image"
version.workspace = true
edition.workspace = true

[dependencies]
pb-core = { path = "../pb-core" }
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
png = "0.17"
mozjpeg = { version = "0.10", default-features = false }
oxipng = { version = "9", default-features = false }

[dev-dependencies]
serde_json = "1"
