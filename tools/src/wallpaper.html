<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Обои для PocketBook — редактор (v7)</title>
<style>
:root{
  --bg:#121314; --panel:#1b1c1f; --panel2:#232428; --line:#2e3035; --fg:#ececea; --muted:#9a9ca3;
  --accent:#5aa9d6; --accent2:#2f6f8f; --good:#6cc28f; --warn:#e0a35a; --r:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:56px 1fr;height:100vh;height:100dvh}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.iconbtn{border:1px solid transparent;background:transparent;width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg)}
.iconbtn:hover{background:var(--panel2)}
.iconbtn:disabled{opacity:.3;cursor:not-allowed;background:transparent}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.vsep{width:1px;height:24px;background:var(--line);flex:none}
.busy{display:none;align-items:center;gap:6px;color:var(--muted);font-size:.78rem}
.busy.on{display:inline-flex}
.busy i{width:12px;height:12px;border:2px solid #4a4d55;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.devopts{display:none;align-items:center;gap:8px;flex-wrap:wrap}
.devopts.on{display:inline-flex}
.mini{display:inline-flex;gap:2px;background:var(--panel2);border-radius:9px;padding:2px}
.mini button{border:0;background:transparent;color:var(--muted);padding:5px 9px;border-radius:7px;cursor:pointer;font-size:.8rem;white-space:nowrap}
.mini button.on{background:#3a3c42;color:var(--fg)}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px #4a4d55;cursor:pointer;padding:0}
.dot.on{box-shadow:0 0 0 2px var(--accent)}
.stage.scene-wood{background:radial-gradient(ellipse at 45% 30%,rgba(255,225,180,.22),transparent 60%),radial-gradient(ellipse at 50% 110%,rgba(0,0,0,.45),transparent 60%),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='0.006 0.11' numOctaves='4' seed='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 .55 .30  0 0 0 .38 .19  0 0 0 .22 .11  0 0 0 0 1'/></filter><rect width='600' height='600' filter='url(%23w)'/></svg>") 0 0/600px 600px,#5b3d26}
.stage.scene-light{background:radial-gradient(circle at 45% 35%,#fbf9f4,#dcd7cc)}
.stage.scene-fabric{background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.10),transparent 65%),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='0.9 0.9' numOctaves='2' seed='5' stitchTiles='stitch'/><feColorMatrix values='0 0 0 .14 .10  0 0 0 .14 .11  0 0 0 .14 .13  0 0 0 0 1'/></filter><rect width='300' height='300' filter='url(%23f)'/></svg>") 0 0/300px 300px,#34373d}
.devwrap{perspective:1800px}
.tilt{position:relative;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.tilt.on{transform:rotateX(16deg) rotateY(-20deg) rotateZ(4deg)}
.body{transform-style:preserve-3d}
.body>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.body .edge{transform:translateZ(var(--depth));filter:brightness(.55)}
.body .face{filter:drop-shadow(0 18px 30px rgba(0,0,0,.45)) drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.tilt.on .body .face{filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.body .depth{position:absolute;inset:0;transform:translateZ(calc(var(--depth) * -1));pointer-events:none}
.win .glare{position:absolute;inset:0;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.05) 28%,rgba(255,255,255,0) 46%,rgba(255,255,255,0) 78%,rgba(255,255,255,.05) 100%);mix-blend-mode:screen}
.win .glare[hidden]{display:none}
.hold{user-select:none;-webkit-user-select:none;touch-action:none}
.hold.active{border-color:var(--accent);color:var(--accent)}
.sec h4{display:flex;justify-content:space-between;align-items:center}
.sec h4 .rst{text-transform:none;letter-spacing:0;font-weight:500;color:var(--accent);cursor:pointer;font-size:.78rem;background:none;border:0;padding:0}
.strength{background:var(--panel2);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.pre{transition:transform .12s,border-color .12s}
.pre:hover{transform:translateY(-2px)}
.rail button:hover{color:var(--fg)}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:.72rem;color:var(--muted);margin-left:4px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.logo small{display:block;font-weight:400;color:var(--muted);font-size:.72rem;margin-top:-2px}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--panel2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.seg button.on{background:#3a3c42;color:var(--fg);font-weight:600}
.seg button small{display:block;font-size:.68rem;color:var(--muted);font-weight:400}
.btn{border:1px solid var(--line);background:var(--panel2);padding:7px 12px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap}
.btn:hover{border-color:#4a4d55}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:600}
.btn.primary:hover{background:#357c9f}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg,.rail svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* main */
.main{display:grid;grid-template-columns:76px 1fr 340px;min-height:0}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:10px 8px}
.rail button{border:0;background:transparent;color:var(--muted);border-radius:12px;padding:9px 4px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem}
.rail button svg{width:22px;height:22px}
.rail button.on{background:var(--panel2);color:var(--fg)}
.rail button.on svg{stroke:var(--accent)}
.stagebox{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#1c1d20,#111214)}
.stage canvas.view{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#ed{cursor:grab}
#ed.drag{cursor:grabbing}
.devwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.body{position:relative;flex:none}
.shell{position:absolute;inset:0;border-radius:inherit}
.bezel,.win{position:absolute}
.win{overflow:hidden}
.win canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
.key{position:absolute;border-radius:999px}
.viewbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.info{color:var(--muted);font-size:.8rem}
.info b{color:var(--fg);font-weight:600}
.info .warn{color:var(--warn)}
.info .ok{color:var(--good)}
.lens{position:absolute;width:190px;height:190px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 6px 24px rgba(0,0,0,.6);pointer-events:none;display:none;z-index:5;background:#888}
.lens canvas{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.lens span{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:.68rem;background:rgba(0,0,0,.6);padding:1px 7px;border-radius:99px;white-space:nowrap}
.splitlbl{position:absolute;top:12px;font-size:.75rem;background:rgba(0,0,0,.6);padding:3px 9px;border-radius:99px;pointer-events:none}

/* drop */
.drop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;z-index:4;background:radial-gradient(circle at 50% 40%,#202226,#121314)}
.drop.hide{display:none}
.drop .ico{width:64px;height:64px;border-radius:18px;border:2px dashed #5b6470;display:flex;align-items:center;justify-content:center;font-size:30px;color:#8fb3cc}
.drop.over{outline:3px dashed var(--accent);outline-offset:-14px}
.drop p{margin:0;color:var(--muted)}

/* panel */
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0}
.ph{position:sticky;top:0;background:var(--panel);padding:14px 16px 10px;font-weight:700;font-size:1rem;border-bottom:1px solid var(--line);z-index:2}
.sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.sec h4{margin:0 0 10px;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .btn,.grid2 .btn{white-space:normal;line-height:1.2;font-size:.84rem;padding:7px 6px;text-align:center}
.sl{display:grid;grid-template-columns:96px 1fr 40px;gap:10px;align-items:center;margin:8px 0;font-size:.86rem}
.sl span:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.sl.dis{opacity:.35;pointer-events:none}
input[type=range]{accent-color:var(--accent);width:100%}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;font-size:.88rem}
.sw{position:relative;width:38px;height:22px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:#3a3c42;border-radius:99px;transition:.2s;cursor:pointer}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--accent2)}
.sw input:checked+i::after{transform:translateX(16px)}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pre{border:2px solid transparent;background:var(--panel2);border-radius:12px;padding:4px 4px 6px;cursor:pointer;text-align:center;font-size:.76rem;color:var(--muted)}
.pre canvas{display:block;width:100%;aspect-ratio:3/4;border-radius:8px;background:#2a2c30;margin-bottom:4px}
.pre.on{border-color:var(--accent);color:var(--fg)}
.layers{display:flex;flex-direction:column;gap:6px}
.layer{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid transparent;border-radius:10px;padding:7px 10px;cursor:pointer}
.layer.on{border-color:var(--accent)}
.layer span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer button{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px 4px}
textarea{width:100%;min-height:64px;resize:vertical;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:212px;overflow-y:auto;padding-right:2px}
.fonts button{background:var(--panel2);border:1px solid transparent;border-radius:9px;padding:8px 8px;cursor:pointer;text-align:left;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fonts button small{display:block;font:400 .68rem system-ui,sans-serif;color:var(--muted)}
.fonts button.on{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:5px 10px;cursor:pointer;font-size:.8rem}
.chip:hover{border-color:var(--accent)}
.colors{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.colors button{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px #4a4d55;cursor:pointer;padding:0}
.colors button.on{box-shadow:0 0 0 2px var(--accent)}
.colors input[type=color]{width:30px;height:30px;border:0;background:none;padding:0;cursor:pointer}
.note{color:var(--muted);font-size:.8rem;margin:6px 0 0}
.empty{color:var(--muted);text-align:center;padding:20px 10px}
code{background:var(--panel2);padding:1px 5px;border-radius:5px;font-size:.88em}
ol.steps{margin:0;padding-left:18px;color:var(--muted);font-size:.85rem}
ol.steps li{margin:4px 0}
ol.steps b{color:var(--fg)}
.expcard{background:var(--panel2);border-radius:12px;padding:12px;margin-bottom:10px}
.expcard .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.expcard .t span{color:var(--muted);font-size:.8rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(200%);opacity:0;pointer-events:none;background:#2b3a46;color:#fff;padding:10px 16px;border-radius:12px;transition:.25s;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.toast.show{transform:translateX(-50%);opacity:1}
.mobonly{display:none}

@media (max-width:900px){
  body{overflow:auto}
  .app{grid-template-rows:auto auto;height:auto;min-height:100dvh;padding-bottom:64px}
  .top{flex-wrap:wrap;padding:8px 10px;gap:8px;position:sticky;top:0;z-index:10}
  .top .seg{flex:1}
  .top .seg button{flex:1;padding:6px 6px}
  .main{grid-template-columns:1fr;grid-template-rows:auto auto}
  .rail{position:fixed;left:0;right:0;bottom:0;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);z-index:15;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .rail button{flex:1;padding:6px 2px}
  .stagebox{height:62vh;height:62dvh}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .ph{position:static}
  .deskonly{display:none}
  .mobonly{display:inline-flex}
  .lens{width:150px;height:150px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">Обои PocketBook<small>редактор заставок</small></div>
    <div class="seg" id="devSeg">
      <button data-d="v" class="on">Verse<small>758×1024 · Ч/Б</small></button>
      <button data-d="i">InkPad Color 3<small>1404×1872 · цвет</small></button>
    </div>
    <div class="spacer deskonly"></div>
    <button class="iconbtn" id="undo" title="Отменить (Ctrl+Z)" disabled><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="iconbtn" id="redo" title="Повторить (Ctrl+Shift+Z)" disabled><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <span class="vsep deskonly"></span>
    <label class="btn deskonly" title="Открыть другую картинку"><svg viewBox="0 0 24 24"><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3M12 4v12M7 9l5-5 5 5"/></svg>Открыть<input type="file" id="file2" accept="image/*" hidden></label>
    <button class="btn primary deskonly" id="topExport" disabled><svg viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>Скачать BMP</button>
  </header>

  <div class="main">
    <nav class="rail" id="rail">
      <button data-t="crop" class="on" title="Кадр: масштаб, положение, поворот"><svg viewBox="0 0 24 24"><path d="M6 2v16h16M2 6h16v16"/></svg>Кадр</button>
      <button data-t="filters" title="Готовые фильтры"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="5"/><circle cx="15" cy="15" r="5"/></svg>Фильтры</button>
      <button data-t="adjust" title="Яркость, контраст, эффекты, дизеринг"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Коррекция</button>
      <button data-t="text" title="Надписи поверх картинки"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>Текст</button>
      <button data-t="export" title="Скачать BMP или PNG"><svg viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>Скачать</button>
    </nav>

    <section class="stagebox">
      <div class="stage" id="stage">
        <canvas class="view" id="ed"></canvas>
        <canvas class="view" id="cmp" hidden></canvas>
        <div class="devwrap" id="devwrap" hidden>
          <div class="tilt" id="tilt"><div class="body" id="body"><div class="depth" id="depth"></div><div class="face" id="face"></div><div class="win" id="win"><canvas id="pvc"></canvas><div class="glare" id="glare"></div></div></div></div>
        </div>
        <div class="splitlbl" id="lblL" hidden style="left:12px">До</div>
        <div class="splitlbl" id="lblR" hidden style="right:12px">После · вид на e-ink</div>
        <div class="lens" id="lens"><canvas id="lensC" width="190" height="190"></canvas><span id="lensT"></span></div>
        <div class="drop" id="drop">
          <div class="ico">＋</div>
          <div style="font-size:1.05rem"><b>Перетащите картинку сюда</b></div>
          <p>или</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
            <label class="btn primary">Выбрать файл<input type="file" id="file" accept="image/*" hidden></label>
            <button class="btn" id="demo">Пример</button>
          </div>
          <p style="font-size:.82rem">JPG, PNG, WebP · вставка из буфера Ctrl+V · всё обрабатывается на вашем устройстве</p>
        </div>
      </div>
      <div class="viewbar">
        <div class="seg" id="viewSeg">
          <button data-v="edit" class="on">Редактор</button>
          <button data-v="split">До / после</button>
          <button data-v="device">На ридере</button>
        </div>
        <button class="btn hold" id="peek" title="Удерживайте, чтобы на секунду увидеть исходную картинку без обработки и без e-ink"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Оригинал</button>
        <button class="btn" id="lensBtn" title="Лупа: наведите или коснитесь картинки"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Лупа</button>
        <label class="btn mobonly">Открыть<input type="file" id="file3" accept="image/*" hidden></label>
        <span class="devopts" id="devopts">
          <span class="mini" id="sideSeg"><button data-side="front" class="on">Спереди</button><button data-side="back">Сзади</button></span>
          <span class="mini" id="sceneSeg"><button data-sc="dark" class="on">Тёмный</button><button data-sc="wood">Дерево</button><button data-sc="light">Светлый</button><button data-sc="fabric">Ткань</button></span>
          <button class="btn" id="tiltBtn" title="Наклон в 3D">3D</button>
          <button class="btn on" id="glareBtn" title="Блики на стекле">Блики</button>
          <span id="colorDots" style="display:inline-flex;gap:6px;align-items:center"></span>
        </span>
        <div class="spacer"></div>
        <span class="busy" id="busy"><i></i>обработка</span>
        <div class="info" id="info"></div>
      </div>
    </section>

    <aside class="panel" id="panel"></aside>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
/* ================= data ================= */
var DEV={
  v:{name:"Verse",file:"verse",W:758,H:1024,ppi:212,bodyW:108,bodyH:156,depth:7.6,chamfer:4.6,round:1.5,scrTop:8.4,mode:"carta",recess:.75,metal:false,
     keys:[{x:13,w:10},{x:28,w:22},{x:58,w:22},{x:85,w:10}],keyY:143.2,keyH:2.3,

  if(worker){wRender(k,S,["proc"],"export_"+k,function(m){if(m.skip||!m.proc){fallback();return;}var c=mkCanvas(d.W,d.H);c.getContext("2d").drawImage(m.proc,0,0);m.proc.close&&m.proc.close();finish(c);});}
  else fallback();
  function fallback(){var c=mkCanvas(d.W,d.H);c.getContext("2d").putImageData(pipe(CCmain,k,d.W,d.H,S,true),0,0);finish(c);}
  return name;}
function doExport(which){if(!st.src)return;toast("Готовлю файл…");
  if(which==="both"){exportOne("v",function(){setTimeout(function(){exportOne("i",function(){toast("Скачано 2 файла");});},400);});}
  else exportOne(which,function(n){toast("Готово: "+n);});}
$("topExport").addEventListener("click",function(){st.fmt="bmp";doExport(st.dev);});

/* ================= device switch ================= */
$("devSeg").addEventListener("click",function(e){var b=e.target.closest("button");if(!b||b.dataset.d===st.dev)return;
  if(st.src){var fh=D().H/st.z;st.dev=b.dataset.d;st.z=D().H/fh;clampPos();}else st.dev=b.dataset.d;
  if(st.preset==="eink")st.S=presetS(PRESETS[1],st.strength);
  [].forEach.call(this.children,function(x){x.classList.toggle("on",x===b);});
  $("topExport").innerHTML='<svg viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>Скачать BMP';
  renderPanel();invalidate(true);commit();});
$("viewSeg").addEventListener("click",function(e){var b=e.target.closest("button");if(b)setView(b.dataset.v);});

/* ================= device view options ================= */
function segPick(id,attr,fn){$(id).addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;[].forEach.call(this.children,function(x){x.classList.toggle("on",x===b);});fn(b.dataset[attr]);});}
segPick("sideSeg","side",function(v){st.side=v;paintDevice();hideLens();});
segPick("sceneSeg","sc",function(v){st.scene=v;paintDevice();});
$("tiltBtn").addEventListener("click",function(){st.tilt=!st.tilt;this.classList.toggle("on",st.tilt);paintDevice();});
$("glareBtn").addEventListener("click",function(){st.glare=!st.glare;this.classList.toggle("on",st.glare);paintDevice();});
$("colorDots").addEventListener("click",function(e){var b=e.target.closest("[data-col]");if(!b)return;D().color=b.dataset.col;paintDevice();});
var pk=$("peek");
function peekOn(e){if(!st.src)return;e.preventDefault();st.peek=true;pk.classList.add("active");if(st.view!=="edit")setView("edit");draw();}
function peekOff(){if(!st.peek)return;st.peek=false;pk.classList.remove("active");draw();}
pk.addEventListener("pointerdown",peekOn);["pointerup","pointerleave","pointercancel"].forEach(function(t){pk.addEventListener(t,peekOff);});

/* ================= keyboard ================= */
document.addEventListener("keydown",function(e){
  if((e.ctrlKey||e.metaKey)&&!/TEXTAREA/.test(document.activeElement.tagName)){var kz=e.key.toLowerCase();if(kz==="z"||kz==="я"){e.preventDefault();e.shiftKey?redo():undo();return;}if(kz==="y"||kz==="н"){e.preventDefault();redo();return;}}
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;var t=st.texts[st.sel];
  if(t&&st.tool==="text"&&/Arrow/.test(e.key)){var s=e.shiftKey?.02:.004;if(e.key==="ArrowLeft")t.x-=s;if(e.key==="ArrowRight")t.x+=s;if(e.key==="ArrowUp")t.y-=s;if(e.key==="ArrowDown")t.y+=s;e.preventDefault();invalidate();commit();}
  if(t&&st.tool==="text"&&(e.key==="Delete"||e.key==="Backspace")){st.texts.splice(st.sel,1);st.sel=st.texts.length-1;renderPanel();invalidate();}});

var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){invalidate(true);},120);});
window.__pbw={st:st,pipe:pipe,hasWorker:function(){return !!worker;},ver:function(){return ver;},full:function(){return full;},compose:compose,makeBMP:makeBMP,demo:demo,setView:setView,setTool:setTool};
renderPanel();layoutAll();draw();
})();
</script>
