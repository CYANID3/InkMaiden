[package]
name = "inkmaiden"
version.workspace = true
edition.workspace = true
description = "InkMaiden — порядок в библиотеке для PocketBook"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
pb-core = { path = "../crates/pb-core" }
pb-image = { path = "../crates/pb-image" }
pb-comics = { path = "../crates/pb-comics" }
pb-books = { path = "../crates/pb-books" }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png", "ico", "bmp", "jpeg", "gif", "webp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Ioctl", "Win32_System_IO", "Win32_Security", "Win32_System_WindowsProgramming", "Win32_UI_Shell"] }
