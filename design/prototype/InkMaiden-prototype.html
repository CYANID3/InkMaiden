:root{
  --paper:#ECECE6; --surface:#F7F7F3; --card:#FFFFFF; --line:#DDDDD4; --line-2:#C9C9BF;
  --ink:#1B1B1A; --ink-2:#3A3A36; --muted:#6A6A62;
  --olive:#6E6E33; --olive-2:#55552A; --olive-3:#808040; --wash:#EEEEDC; --tint:#E3E3C6;
  --ok:#3F7A3A; --warn:#9A6A14; --err:#A3402E; --stage:#E2E2DA;
  --r-s:8px; --r-m:12px; --r-l:18px;
  --shadow:0 1px 0 rgba(27,27,26,.04),0 10px 28px -16px rgba(27,27,26,.28);
  --fs-xs:12px; --fs-s:13.5px; --fs:15px; --fs-l:19px; --fs-xl:28px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#2B2B28; --surface:#32322F; --card:#3A3A36; --line:#4A4A45; --line-2:#5C5C56;
  --ink:#EEEEE7; --ink-2:#D8D8CF; --muted:#AEAEA4;
  --olive:#C4C487; --olive-2:#D6D69E; --olive-3:#B5B577; --wash:#41412D; --tint:#4B4B33;
  --ok:#8FCF99; --warn:#EDBB71; --err:#F39A90; --stage:#242422;
  --shadow:0 1px 0 rgba(0,0,0,.12),0 12px 28px -16px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:400 var(--fs)/1.5 Onest,"Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--olive-3);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- оболочка */
.app{display:grid;grid-template-columns:248px 1fr;height:100vh}
.rail{display:flex;flex-direction:column;gap:6px;padding:18px 14px;border-right:1px solid var(--line);background:var(--surface);min-height:0}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 14px}
.brand svg{width:38px;height:38px;flex:none}
.brand b{display:block;font-size:19px;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:var(--fs-xs);color:var(--muted)}
.cur{display:grid;grid-template-columns:34px 1fr;gap:2px 10px;align-items:center;padding:10px;border-radius:var(--r-m);background:var(--card);border:1px solid var(--line);margin-bottom:10px;cursor:pointer;text-align:left}
.cur .mini{grid-row:span 2}
.cur b{font-size:var(--fs-s);font-weight:600}
.cur small{font-size:var(--fs-xs);color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
.dot.on{background:var(--ok)}
.nav{display:grid;gap:2px}
.nav button{display:grid;grid-template-columns:22px 1fr;gap:0 11px;align-items:center;padding:10px 10px;border:0;border-radius:var(--r-m);background:none;text-align:left;cursor:pointer;color:var(--ink-2)}
.nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button b{font-weight:500}
.nav button:hover{background:var(--paper)}
.nav button[aria-current]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.nav button[aria-current] svg{stroke:var(--olive)}
.rail .spacer{flex:1}
.rail .ver{font-size:var(--fs-xs);color:var(--muted);padding:6px 10px 0}
.main{overflow:auto;min-width:0;position:relative}
.page{padding:30px 38px 120px;max-width:1360px}
.head{display:flex;align-items:flex-end;gap:18px;margin-bottom:22px}
.head h1{font-size:var(--fs-xl);font-weight:600;letter-spacing:-.02em;margin:0}
.head p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.head .grow{flex:1}

/* ---------- элементы */
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--line-2)}
.btn.primary{background:var(--olive-2);border-color:var(--olive-2);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#22221f}
.btn.quiet{background:none;border-color:transparent;color:var(--olive)}
.btn.danger{color:var(--err)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:20px 22px;box-shadow:var(--shadow)}
.panel h2{font-size:var(--fs-l);font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.hint{color:var(--muted);font-size:var(--fs-s);margin:0 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:500;padding:3px 10px;border-radius:99px;background:var(--wash);color:var(--olive-2);white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.chip.mute{background:var(--paper);color:var(--muted)}
.seg{display:inline-flex;background:var(--paper);border-radius:var(--r-m);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.input,select.input{height:40px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--card);padding:0 12px;min-width:0;width:100%}
.field{display:grid;gap:6px}
.field>span{font-weight:500;font-size:var(--fs-s)}
.field small{color:var(--muted);font-size:var(--fs-xs)}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.stack{display:grid;gap:18px;align-content:start}
.check{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:var(--fs-s)}
.check input{accent-color:var(--olive-3);width:16px;height:16px}
.check input.toggle{width:38px;height:22px}
.toggle{appearance:none;width:38px;height:22px;border-radius:99px;background:var(--line-2);position:relative;cursor:pointer;flex:none;transition:.2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.toggle:checked{background:var(--olive-3)}
.toggle:checked::after{left:19px}
.code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--paper);padding:1px 6px;border-radius:5px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0;font-size:var(--fs-s)}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0}
dd.unk{color:var(--muted);font-style:italic}
.actions{position:sticky;bottom:0;margin:22px -38px -120px;padding:14px 38px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;z-index:5}
.actions .where{margin-right:auto;color:var(--muted);font-size:var(--fs-s);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions .where b{color:var(--ink-2);font-weight:500}

/* ---------- рисунок читалки */
.reader-art{display:block}
.mini{width:30px;height:40px}

/* ---------- «Моё устройство» */
.hero{display:grid;grid-template-columns:260px 1fr;gap:34px;align-items:center;padding:30px 34px}
.hero .pic{display:grid;place-items:center;background:var(--stage);border-radius:var(--r-l);padding:22px 0;position:relative}
.hero h2{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:0}
.hero .sub{color:var(--muted);margin:2px 0 16px}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.spec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px}
.spec small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.spec b{font-weight:600;font-size:16px}
.spec .unk{color:var(--muted);font-style:italic;font-weight:400}
.mem{margin-top:18px}
.mem .bar{height:12px;border-radius:99px;background:var(--paper);overflow:hidden;display:flex}
.mem .bar i{display:block;height:100%}
.mem .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted);margin-top:8px}
.mem .legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;background:var(--c)}
.saved{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.dcard{display:grid;grid-template-columns:46px 1fr;gap:4px 14px;align-items:center;padding:16px;border-radius:var(--r-l);border:1px solid var(--line);background:var(--card);text-align:left}
.dcard[aria-current]{border-color:var(--olive-3);box-shadow:0 0 0 1px var(--olive-3)}
.dcard .art{grid-row:span 3}
.dcard b{font-weight:600}
.dcard small{color:var(--muted);font-size:var(--fs-xs)}

/* ---------- списки: книги, комиксы */
.split>*{min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.list{display:grid}
.item{display:grid;grid-template-columns:40px 1fr auto;gap:2px 14px;align-items:center;padding:10px 12px;border-radius:var(--r-m);cursor:pointer}
.item+.item{border-top:1px solid var(--line)}
.item:hover{background:var(--surface)}
.item[aria-selected="true"]{background:var(--wash)}
.item .cov{grid-row:span 2;width:40px;height:56px;border-radius:4px;display:grid;place-items:center;font-size:10px;color:var(--muted);text-align:center;line-height:1.1;overflow:hidden}
.item b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--muted);font-size:var(--fs-xs)}
.item .tags{grid-row:span 2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:260px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.src{display:flex;align-items:center;gap:12px;padding:14px 18px}
.src svg{width:22px;height:22px;stroke:var(--olive);fill:none;stroke-width:1.7;flex:none}
.src .path{flex:1;min-width:0}
.src .path b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src .path small{color:var(--muted)}
.hist{position:relative}
.hist-menu{position:absolute;top:44px;right:0;width:380px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow);padding:6px;z-index:20;display:none}
.hist-menu.open{display:block}
.hist-menu button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;background:none;border-radius:8px;cursor:pointer}
.hist-menu button:hover{background:var(--surface)}
.hist-menu small{color:var(--muted);display:block;font-size:var(--fs-xs)}
.covers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.covers button{min-width:0;border:1px solid var(--line);border-radius:8px;padding:0;background:none;cursor:pointer;aspect-ratio:3/4;overflow:hidden}
.covers button[aria-pressed="true"]{outline:2px solid var(--olive-3);outline-offset:2px}
.found{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:6px}
.found label{min-width:0;display:grid;grid-template-columns:18px 1fr;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-m);font-size:var(--fs-s);cursor:pointer}
.found label small{display:block;color:var(--muted);font-size:var(--fs-xs)}

/* ---------- комиксы */
.saving{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.saving .big{font-size:52px;font-weight:600;letter-spacing:-.03em;line-height:1}
.saving .cap{color:var(--muted)}
.bars{display:grid;gap:10px;margin:18px 0}
.bars .b{display:grid;grid-template-columns:62px 1fr 74px;gap:12px;align-items:center;font-size:var(--fs-s)}
.bars .t{height:16px;border-radius:6px;background:var(--paper);overflow:hidden}
.bars .t i{display:block;height:100%;border-radius:6px;background:var(--ink-2)}
.bars .b.after .t i{background:var(--olive-3)}
.bars b{text-align:right;font-weight:600}
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 16px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--card);text-align:left;cursor:pointer}
.mode[aria-pressed="true"]{border-color:var(--olive-3);background:var(--wash)}
.mode b{font-weight:600}
.mode .est{font-weight:600;color:var(--olive-2);font-size:var(--fs-s)}
.mode small{grid-column:1/-1;color:var(--muted);font-size:var(--fs-xs)}
table.vols{width:100%;border-collapse:collapse;font-size:var(--fs-s)}
table.vols th{color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
table.vols td{padding:10px;border-bottom:1px solid var(--line)}
table.vols td.n{text-align:right;white-space:nowrap}
table.vols small{display:block;color:var(--muted);font-size:var(--fs-xs)}

/* ---------- редакторы: обои, иконка сна */
.editor{display:grid;grid-template-rows:auto 1fr;height:100vh}
.ebar{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--surface)}
.ebar h1{font-size:var(--fs-l);font-weight:600;margin:0 auto 0 0}
.ebody{display:grid;grid-template-columns:64px 1fr 320px;min-height:0}
.tools{display:grid;align-content:start;gap:4px;padding:10px 8px;border-right:1px solid var(--line);background:var(--surface)}
.tools button{display:grid;justify-items:center;gap:3px;padding:8px 2px;border:0;border-radius:10px;background:none;font-size:11px;color:var(--muted);cursor:pointer}
.tools button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tools button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.canvas{display:grid;place-items:center;background:var(--stage);position:relative;min-height:0;overflow:hidden}
.canvas .note{position:absolute;left:16px;bottom:14px;font-size:var(--fs-xs);color:var(--muted)}
.side{border-left:1px solid var(--line);background:var(--surface);padding:18px;overflow:auto;display:grid;gap:16px;align-content:start}
.side h3{margin:0;font-size:var(--fs);font-weight:600}
.slider{display:grid;grid-template-columns:1fr 46px;gap:10px;align-items:center;font-size:var(--fs-s)}
.slider input{accent-color:var(--olive-3)}
.status{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:14px;border-radius:var(--r-m);background:var(--card);border:1px solid var(--line)}
.status .ic{grid-row:span 2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.status .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
.status b{font-weight:600;font-size:var(--fs-s)}
.status small{color:var(--muted);font-size:var(--fs-xs)}
.backups{display:grid;gap:6px}
.backups div{display:flex;align-items:center;gap:10px;font-size:var(--fs-s);padding:8px 10px;border-radius:var(--r-s);background:var(--card);border:1px solid var(--line)}
.backups div span{flex:1}

/* ---------- каталог работ (выдвижная панель) */
.drawer-back{position:fixed;inset:0;background:rgba(20,20,18,.36);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,92vw);background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:.26s cubic-bezier(.2,.8,.2,1);z-index:41;display:grid;grid-template-rows:auto 1fr}
.drawer.open{transform:none}.drawer-back.open{opacity:1;pointer-events:auto}
.drawer header{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0 auto 0 0;font-size:var(--fs-l);font-weight:600}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;padding:22px;overflow:auto;align-content:start}
.work{display:grid;gap:6px;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.work .th{aspect-ratio:3/4;border-radius:10px;border:1px solid var(--line);overflow:hidden;background:var(--card)}
.work b{font-weight:500;font-size:var(--fs-s)}
.work small{color:var(--muted);font-size:var(--fs-xs)}

/* ---------- настройки */
.settings{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:start}
.snav{display:grid;gap:2px;position:sticky;top:20px}
.snav button{text-align:left;padding:9px 12px;border-radius:10px;border:0;background:none;cursor:pointer;color:var(--ink-2);display:flex;align-items:center;gap:10px}
.snav button[aria-current]{background:var(--card);box-shadow:var(--shadow);color:var(--ink);font-weight:500}
.snav .sep{font-size:var(--fs-xs);color:var(--muted);padding:14px 12px 4px}
.sbody{display:grid;gap:18px;max-width:820px}
.prow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.tree{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.55;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;white-space:pre;overflow:auto;margin:0}

/* ---------- окна */
.modal-back{position:fixed;inset:0;background:rgba(20,20,18,.45);display:none;place-items:center;z-index:60;padding:20px}
.modal-back.open{display:grid}
.modal{background:var(--surface);border-radius:20px;border:1px solid var(--line);box-shadow:0 30px 80px -30px rgba(0,0,0,.5);width:min(560px,100%);padding:26px}
.modal h2{margin:0 0 6px;font-size:22px;font-weight:600;letter-spacing:-.01em}
.modal .choices{display:grid;gap:10px;margin:18px 0}
.modal .choices button{display:grid;grid-template-columns:40px 1fr auto;gap:2px 14px;align-items:center;padding:14px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left}
.modal .choices button:hover{border-color:var(--olive-3)}
.modal .choices small{color:var(--muted);font-size:var(--fs-xs);grid-column:2/-1}
.modal .choices button>span:first-child{grid-row:span 2}
.modal .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.gate{position:absolute;inset:0;display:grid;place-items:center;background:var(--paper);z-index:30;padding:30px}
.gate .box{text-align:center;max-width:460px;display:grid;gap:12px;justify-items:center}
.gate h2{font-size:26px;font-weight:600;margin:0}
.gate p{margin:0;color:var(--muted)}
.pulse{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:var(--wash);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px color-mix(in srgb,var(--olive-3) 0%,transparent),0 0 0 0 transparent;transform:scale(1.03)}0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--olive-3) 30%,transparent)}}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#1B1B1A;color:#F2F2EA;padding:11px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:80;font-size:var(--fs-s)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- панель прототипа (только для просмотра) */
.proto{background:#1B1B1A;color:#ECECE6;border-radius:14px;padding:10px;display:grid;gap:6px;font-size:12px;margin:0 0 10px}
.proto .r{display:flex;gap:6px}.proto .r button{flex:1}
.proto b{font-weight:600;margin-right:4px}
.proto select{width:100%}
.proto select,.proto button{background:#33332F;color:#ECECE6;border:1px solid #4A4A45;border-radius:8px;padding:5px 8px;font-size:12px;cursor:pointer}

/* ---------- план работ */
.plan{max-width:900px;display:grid;gap:18px}
.plan h2{font-size:22px;margin:0 0 8px}
.plan h3{font-size:var(--fs);margin:16px 0 6px}
.plan ol,.plan ul{margin:6px 0;padding-left:22px;display:grid;gap:5px}
.plan table{width:100%;border-collapse:collapse;font-size:var(--fs-s)}
.plan td,.plan th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.plan th{color:var(--muted);font-weight:500}
.q{border-left:3px solid var(--olive-3);padding:10px 14px;background:var(--surface);border-radius:0 var(--r-m) var(--r-m) 0}
@media (max-width:1100px){.split{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.specs{grid-template-columns:1fr 1fr}.settings{grid-template-columns:1fr}.snav{position:static;grid-auto-flow:column;overflow:auto}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><svg viewBox="0 0 512 512" aria-hidden="true"><rect x="16" y="16" width="480" height="480" rx="112" fill="#6E6E33"/><rect x="112" y="102" width="288" height="320" rx="22" fill="#F2F2EA"/><g fill="#A3A397"><rect x="146" y="158" width="150" height="16" rx="8"/><rect x="146" y="198" width="126" height="16" rx="8"/><rect x="146" y="238" width="142" height="16" rx="8"/><rect x="146" y="278" width="100" height="16" rx="8"/><rect x="146" y="338" width="140" height="16" rx="8"/></g><path d="M312 78h62v152l-31-30-31 30z" fill="#161615"/><path d="M343 246C343 246 312 290 312 312a31 31 0 0 0 62 0C374 290 343 246 343 246Z" fill="#161615"/></svg>
      <div><b>InkMaiden</b><span>библиотека и читалка</span></div></div>
    <button class="cur" id="cur" title="Текущая читалка. Сменить — в Настройках"></button>

</div>

<script>
/* ===================== данные прототипа */
const DEV = {
  c3: { id:'PB743K3', name:'InkPad Color 3', full:'PocketBook InkPad Color 3', code:'743K3', inch:'7,8″', res:'1404×1872', ppi:300, color:true, colorRes:'702×936, 150 ppi', display:'E Ink Kaleido 3',

const S = { page:'device', scenario:'connected', selected:'c3', connected:'c3', theme:'light', plan:false,
  books:{ sel:1, cover:1 }, comics:{ mode:'balanced' }, wall:{ tool:'crop' }, sleep:{ tool:'pic' }, set:'general' };

/* ===================== помощники */
const $ = s => document.querySelector(s);
const el = (t, a = {}, ...k) => { const e = document.createElement(t); for (const [n, v] of Object.entries(a)) { if (n === 'html') e.innerHTML = v; else if (n.startsWith('on')) e[n] = v; else if (v === true) e.setAttribute(n, n.startsWith('aria') ? 'true' : ''); else if (v !== false && v != null) e.setAttribute(n, v); }

const I = {
  device:'<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M9.5 18h5"/>',

  wall:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9.5" r="1.8"/><path d="M4 18l5.5-5.5 3.5 3.5 2.5-2.5L20 18"/>',

// рисунок читалки (корпус по пропорциям модели, экран с картинкой)
function art(key, h = 200, screen = 'page') {

  const s = h / k[1], W = k[0] * s, sx = (k[0] - k[2]) / 2 * s, sy = k[4] * s, sw = k[2] * s, sh = k[3] * s;
  const scr = screen === 'sleep'
